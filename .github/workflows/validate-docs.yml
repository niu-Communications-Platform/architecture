name: Validate documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate bilingual documentation structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation conventions
        run: python scripts/validate-docs.py
