name: Validate documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate bilingual documentation structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation conventions
        if: github.event_name == 'push'
        run: python scripts/validate-docs.py

      - name: Validate documentation conventions and translation changes
        if: github.event_name == 'pull_request'
        run: python scripts/validate-docs.py --base-ref "${{ github.event.pull_request.base.sha }}"
